# CellUDA: BRCA-M2C (source) -> CoNSeP (target). Paper setting; initialised from the BRCA-M2C source head (seed 1).
logging:
  mode: offline
  project: celluda
  notes: brca_to_consep
  log_comment: brca_to_consep
  wandb_dir: ./runtime/logs
  log_dir: ./runtime/logs
  level: Debug
random_seed: 1
gpu: 0
data:
  matching:
    match_distance: 12
  dataset_path: ./data/brca_m2c
  source_splits_dir: ./configs/splits/brca_m2c
  source_train_split: train
  source_val_split: test
  target_dataset_path: ./data/consep
  target_splits_dir: ./configs/splits/consep
  target_train_split: train
  target_val_split: test
  num_classes: 3
  evaluation: metric
  label_map:
    1: Lymphocytes
    2: Tumor/Epithelial
    3: All others
  class_map:
    train_mapping:
      1: 0
      2: 1
      3: 2
    target_eval_mapping:
      1: 2
      2: 0
      3: 1
      4: 1
      5: 2
      6: 2
      7: 2
    target_pred_mapping:
      0: 0
      1: 1
      2: 2
cellvit_path: ./checkpoints/CellViT-SAM-H-x40-AMP.pth
classifier_path: ./checkpoints/source_heads/brca_m2c_seed1.pth
model:
  hidden_dim:
  - 512
uda:
  enable: true
  warmup_epochs: 0
  lambda_u: 1
  ema_alpha: 0.999
  pseudo_thresh: 0.99
  num_tta: 3
  token_noise_weak_mean: 0.0
  token_noise_weak_std: 0.1
  token_noise_strong_mean: 0.0
  token_noise_strong_std: 0.15
  feature_dropout_p: 0.15
training:
  cache_dir: ./runtime/cache
  classifier_export_dir: ./checkpoints/adapted
  batch_size: 256
  epochs: 800
  drop_rate: 0.1
  optimizer: AdamW
  optimizer_hyperparameter:
    betas:
    - 0.85
    - 0.9
    lr: 0.0003
    weight_decay: 0.0001
  early_stopping_patience: 20
  early_stopping_min_delta: 0
  scheduler:
    scheduler_type: exponential
    gamma: 0.995
  mixed_precision: true
  eval_every: 1
