# Template config for your own source -> target setting. Copy it, move it to ./data, and fill in every placeholder
# and the class mappings, then: python run.py --config configs/my_setting.yaml --gpu 0
# For source-only head training remove the `uda` block and point the target entries at the
# source dataset (as in source_consep.yaml).
logging:
  mode: offline                      # W&B is used offline only (logs under wandb_dir)
  project: celluda
  notes: my_setting
  log_comment: my_setting            # name of the run folder under log_dir
  wandb_dir: ./runtime/logs
  log_dir: ./runtime/logs
  level: Debug
random_seed: 1
gpu: 0
data:
  matching:
    match_distance: 12               # px radius for matching predicted and ground-truth centroids

  dataset_path: ./data/your_source_data
  source_splits_dir: ./configs/splits/your_source_data  
  source_train_split: train
  source_val_split: test
  target_dataset_path: ./data/your_target_data
  target_splits_dir: ./configs/splits/your_target_data   
  target_train_split: train
  target_val_split: test
  num_classes: 4                     # number of classes the head is trained on
  evaluation: plot                   # metric: compute target metrics | plot: write overlays only
  label_map:                         # original class ids of the SOURCE labels
    1: ClassA
    2: ClassB
    3: ClassC
  class_map:
    train_mapping:                   # source original id -> head output index 0..num_classes-1 (-1 = ignore)
      1: 0
      2: 1
      3: 2
    target_eval_mapping:             # target original id -> evaluation class
      1: 0
      2: 1
      3: 2
    target_pred_mapping:             # head output index -> evaluation class
      0: 0
      1: 1
      2: 2
cellvit_path: ./checkpoints/CellViT-SAM-H-x40-AMP.pth
classifier_path: ./checkpoints/source_heads/your_source_head.pth   # head to start from (null = random init)
model:
  hidden_dim:
  - 512
uda:
  enable: true
  warmup_epochs: 0
  lambda_u: 1
  ema_alpha: 0.999
  pseudo_thresh: 0.99
  num_tta: 3
  token_noise_weak_mean: 0.0
  token_noise_weak_std: 0.1
  token_noise_strong_mean: 0.0
  token_noise_strong_std: 0.15
  feature_dropout_p: 0.15
training:
  cache_dir: ./runtime/cache         # HDF5 cell-embedding caches
  classifier_export_dir: ./checkpoints/adapted
  # extraction_batch_size: 4       # images per CellViT segmentation batch (lower if GPU memory is short)
  batch_size: 256
  epochs: 800
  drop_rate: 0.1
  optimizer: AdamW
  optimizer_hyperparameter:
    betas:
    - 0.85
    - 0.9
    lr: 0.0003
    weight_decay: 0.0001
  early_stopping_patience: 20
  early_stopping_min_delta: 0
  scheduler:
    scheduler_type: exponential
    gamma: 0.995
  mixed_precision: true
  eval_every: 1
