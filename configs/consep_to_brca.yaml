# CellUDA: CoNSeP (source) -> BRCA-M2C (target). Paper setting; initialised from the CoNSeP source head (seed 1).
logging:
  mode: offline
  project: celluda
  notes: consep_to_brca
  log_comment: consep_to_brca
  wandb_dir: ./runtime/logs
  log_dir: ./runtime/logs
  level: Debug
random_seed: 1
gpu: 0
data:
  matching:
    match_distance: 12
  dataset_path: ./data/consep
  source_splits_dir: ./configs/splits/consep
  source_train_split: train
  source_val_split: test
  target_dataset_path: ./data/brca_m2c
  target_splits_dir: ./configs/splits/brca_m2c
  target_train_split: train
  target_val_split: test
  num_classes: 4
  evaluation: metric # metric/plot
  label_map:
    1: Other
    2: Inflammatory
    3: Healthy Epithelial
    4: Dysplastic/Malignant epithelial
    5: Fibroblast
    6: Muscle
    7: Endothelial
  class_map:
    train_mapping:
      1: 0
      2: 1
      3: 2
      4: 2
      5: 3
      6: 3
      7: 3
    target_eval_mapping:
      1: 0
      2: 1
      3: 2
    target_pred_mapping:
      0: 2
      1: 0
      2: 1
      3: 2
cellvit_path: ./checkpoints/CellViT-SAM-H-x40-AMP.pth
classifier_path: ./checkpoints/source_heads/consep_seed1.pth
model:
  hidden_dim:
  - 512
uda:
  enable: true
  warmup_epochs: 0
  lambda_u: 1
  ema_alpha: 0.999
  pseudo_thresh: 0.99
  num_tta: 3
  token_noise_weak_mean: 0.0
  token_noise_weak_std: 0.1
  token_noise_strong_mean: 0.0
  token_noise_strong_std: 0.15
  feature_dropout_p: 0.15
training:
  cache_dir: ./runtime/cache
  classifier_export_dir: ./checkpoints/adapted
  extraction_batch_size: 1
  batch_size: 256
  epochs: 800
  drop_rate: 0.1
  optimizer: AdamW
  optimizer_hyperparameter:
    betas:
    - 0.85
    - 0.9
    lr: 0.0003
    weight_decay: 0.0001
  early_stopping_patience: 20
  early_stopping_min_delta: 0
  scheduler:
    scheduler_type: exponential
    gamma: 0.995
  mixed_precision: true
  eval_every: 1
