# Source-only training of the classifier head on PanopTILs (step 1). Produces checkpoints/source_heads/panoptils_seed<k>.pth.
# Validation matching is restricted to the central 256x256 region of each 1024x1024 tile.
logging:
  mode: offline
  project: celluda
  notes: source_panoptils
  log_comment: source_panoptils
  wandb_dir: ./runtime/logs
  log_dir: ./runtime/logs
  level: Debug
random_seed: 1
gpu: 0
data:
  matching:
    match_distance: 12
    restrict_val_matching_to_center_patch: true
    val_matching_center_patch_size: 256
  dataset_path: ./data/panoptils
  source_splits_dir: ./configs/splits/panoptils
  source_train_split: train
  source_val_split: test
  target_dataset_path: ./data/panoptils
  target_splits_dir: ./configs/splits/panoptils
  target_train_split: train
  target_val_split: test
  num_classes: 4
  evaluation: metric
  label_map:
    1: CancerEpithelium
    2: NormalEpithelium
    3: TILsCell
    4: ActiveTILsCell
    5: StromalCellNOS
    6: ActiveStromalCellNOS
    7: OtherCell
    8: UnknownOrAmbiguousCell
  class_map:
    train_mapping:
      1: 1
      2: 1
      3: 3
      4: 3
      5: 2
      6: 2
      7: 0
      8: -1
    target_eval_mapping:
      1: 1
      2: 1
      3: 0
      4: 0
      5: 2
      6: 2
      7: 2
      8: 2
    target_pred_mapping:
      0: 2
      1: 1
      2: 2
      3: 0
cellvit_path: ./checkpoints/CellViT-SAM-H-x40-AMP.pth
classifier_path: null
model:
  hidden_dim:
  - 512
training:
  cache_dir: ./runtime/cache
  classifier_export_dir: ./checkpoints/source_heads
  batch_size: 256
  epochs: 800
  drop_rate: 0.2
  optimizer: AdamW
  optimizer_hyperparameter:
    betas:
    - 0.85
    - 0.9
    lr: 0.0003
    weight_decay: 0.0001
  early_stopping_patience: 10
  early_stopping_min_delta: 0
  scheduler:
    scheduler_type: exponential
    gamma: 0.995
  mixed_precision: true
  eval_every: 1
