# Source-only training of the classifier head on CoNSeP (step 1). Produces checkpoints/source_heads/consep_seed<k>.pth.
logging:
  mode: offline
  project: celluda
  notes: source_consep
  log_comment: source_consep
  wandb_dir: ./runtime/logs
  log_dir: ./runtime/logs
  level: Debug
random_seed: 1
gpu: 0
data:
  matching:
    match_distance: 12
  dataset_path: ./data/consep
  source_splits_dir: ./configs/splits/consep
  source_train_split: train
  source_val_split: test
  target_dataset_path: ./data/consep
  target_splits_dir: ./configs/splits/consep
  target_train_split: train
  target_val_split: test
  num_classes: 4
  evaluation: metric
  label_map:
    1: Other
    2: Inflammatory
    3: Healthy Epithelial
    4: Dysplastic/Malignant epithelial
    5: Fibroblast
    6: Muscle
    7: Endothelial
  class_map:
    train_mapping:
      1: 0
      2: 1
      3: 2
      4: 2
      5: 3
      6: 3
      7: 3
    target_eval_mapping:
      1: 2
      2: 0
      3: 1
      4: 1
      5: 2
      6: 2
      7: 2
    target_pred_mapping:
      0: 2
      1: 0
      2: 1
      3: 2
cellvit_path: ./checkpoints/CellViT-SAM-H-x40-AMP.pth
classifier_path: null
model:
  hidden_dim:
  - 512
training:
  cache_dir: ./runtime/cache
  classifier_export_dir: ./checkpoints/source_heads
  extraction_batch_size: 1
  batch_size: 256
  epochs: 800
  drop_rate: 0.2
  optimizer: AdamW
  optimizer_hyperparameter:
    betas:
    - 0.85
    - 0.9
    lr: 0.0003
    weight_decay: 0.0001
  early_stopping_patience: 20
  early_stopping_min_delta: 0
  scheduler:
    scheduler_type: exponential
    gamma: 0.995
  mixed_precision: true
  eval_every: 1
